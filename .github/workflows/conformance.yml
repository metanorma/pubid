name: conformance
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pubid/pubid-tests
          path: pubid-tests
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Corpus conformance (CLEAN gate, DIRTY ledger)
        run: bundle exec rake conformance:run
        env:
          PUBID_TESTS_PATH: ${{ github.workspace }}/pubid-tests
