# Releases the root pubid gem to RubyGems and creates a GitHub release.
# V2 single-gem layout: builds and pushes only ./pubid.gemspec.
# Pushes to RubyGems authenticate via trusted publishing (GitHub Actions
# OIDC): publisher configured on rubygems.org for repo pubid/pubid with
# workflow filename release.yml. No API key secret is used — do not write
# ~/.gem/credentials in this workflow, its presence would override OIDC.
name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next version (e.g. 2.0.0.pre.alpha.1, 2.0.1, major, minor, patch, pre).
          Pass 'skip' to re-push the current version without bumping.
        required: true
        type: string
      dry_run:
        description: 'Dry run (build only, do not push or tag)'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref_name }}

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        # gem push only speaks OIDC trusted publishing on RubyGems >= 3.6;
        # Ruby 3.3 bundles an older RubyGems, so pin the latest explicitly.
        rubygems: latest
        bundler-cache: true

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Install gem-release
      run: gem install gem-release

    - name: Bump version
      if: ${{ inputs.next_version != 'skip' }}
      run: gem bump --version "${{ inputs.next_version }}" --no-commit

    - name: Read version
      id: version
      run: |
        NEW_VERSION=$(ruby -e "require_relative 'lib/pubid/version'; puts Pubid::VERSION")
        echo "value=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        if [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        fi
        echo "Resolved version: $NEW_VERSION"

    # Fail before any commit/tag/push when the target version is already on
    # RubyGems (e.g. a 'skip' re-run after a partially completed release).
    - name: Check version is not already published
      if: ${{ !inputs.dry_run }}
      run: |
        VERSION="${{ steps.version.outputs.value }}"
        if curl -sf "https://rubygems.org/api/v1/versions/pubid.json" \
          | jq -e --arg v "$VERSION" '[.[].number] | index($v) != null' > /dev/null; then
          echo "::error::pubid $VERSION is already published to RubyGems."
          echo "::error::Bump to a new version instead of re-pushing the same one."
          exit 1
        fi
        echo "pubid $VERSION is not yet published — proceeding."

    - name: Commit and tag
      if: ${{ !inputs.dry_run && inputs.next_version != 'skip' }}
      run: |
        git commit -am "Bump version to ${{ steps.version.outputs.value }}" \
          || echo "No version changes to commit"
        git tag "v${{ steps.version.outputs.value }}"

    - name: Build gem
      run: gem build pubid.gemspec

    # Authenticates via OIDC trusted publishing (no credentials file): gem
    # push mints a token using this job's id-token: write permission.
    - name: Push gem to RubyGems
      if: ${{ !inputs.dry_run }}
      run: |
        if ! gem push "pubid-${{ steps.version.outputs.value }}.gem"; then
          echo "::error::gem push failed. Pushes authenticate via the RubyGems trusted publisher"
          echo "::error::for pubid/pubid + release.yml. Verify on rubygems.org that the publisher"
          echo "::error::matches (repository owner/name, workflow filename, environment), that this"
          echo "::error::job has id-token: write, and that RubyGems >= 3.6 is installed."
          exit 1
        fi

    - name: Push branch and tag
      if: ${{ !inputs.dry_run && inputs.next_version != 'skip' }}
      run: |
        git push origin "HEAD:${{ github.ref_name }}"
        git push origin "v${{ steps.version.outputs.value }}"

    - name: Create GitHub Release
      if: ${{ !inputs.dry_run && inputs.next_version != 'skip' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        FLAGS=()
        if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
          FLAGS+=(--prerelease)
        fi
        gh release create "v${{ steps.version.outputs.value }}" \
          --title "Release v${{ steps.version.outputs.value }}" \
          --generate-notes \
          "${FLAGS[@]}"

    - name: Dry-run summary
      if: ${{ inputs.dry_run }}
      run: |
        echo "## Dry-run summary"
        echo "Would have released pubid ${{ steps.version.outputs.value }} (prerelease=${{ steps.version.outputs.prerelease }})"
        ls -la ./*.gem || true
