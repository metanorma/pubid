# Releases the root pubid gem to RubyGems and creates a GitHub release.
# V2 single-gem layout: builds and pushes only ./pubid.gemspec.
name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next version (e.g. 2.0.0.pre.alpha.1, 2.0.1, major, minor, patch, pre).
          Pass 'skip' to re-push the current version without bumping.
        required: true
        type: string
      dry_run:
        description: 'Dry run (build only, do not push or tag)'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref_name }}

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Install gem-release
      run: gem install gem-release

    - name: Bump version
      if: ${{ inputs.next_version != 'skip' }}
      run: gem bump --version "${{ inputs.next_version }}" --no-commit

    - name: Read version
      id: version
      run: |
        NEW_VERSION=$(ruby -e "require_relative 'lib/pubid/version'; puts Pubid::VERSION")
        echo "value=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        if [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        fi
        echo "Resolved version: $NEW_VERSION"

    # Fail fast with an actionable message instead of an opaque 401 from
    # gem push: a missing/empty secret resolves to empty credentials.
    - name: Check RubyGems credentials
      if: ${{ !inputs.dry_run }}
      env:
        RUBYGEMS_API_KEY: ${{ secrets.METANORMA_CI_RUBYGEMS_API_KEY }}
      run: |
        if [ -z "$RUBYGEMS_API_KEY" ]; then
          echo "::error::The METANORMA_CI_RUBYGEMS_API_KEY secret is missing or empty."
          echo "::error::Set it under pubid organization Settings > Secrets and variables > Actions,"
          echo "::error::scoped to this repository."
          exit 1
        fi
        echo "RubyGems API key is configured (length: ${#RUBYGEMS_API_KEY})"

    # Fail before any commit/tag/push when the target version is already on
    # RubyGems (e.g. a 'skip' re-run after a partially completed release).
    - name: Check version is not already published
      if: ${{ !inputs.dry_run }}
      run: |
        VERSION="${{ steps.version.outputs.value }}"
        if curl -sf "https://rubygems.org/api/v1/versions/pubid.json" \
          | jq -e --arg v "$VERSION" '[.[].number] | index($v) != null' > /dev/null; then
          echo "::error::pubid $VERSION is already published to RubyGems."
          echo "::error::Bump to a new version instead of re-pushing the same one."
          exit 1
        fi
        echo "pubid $VERSION is not yet published — proceeding."

    - name: Commit and tag
      if: ${{ !inputs.dry_run && inputs.next_version != 'skip' }}
      run: |
        git commit -am "Bump version to ${{ steps.version.outputs.value }}" \
          || echo "No version changes to commit"
        git tag "v${{ steps.version.outputs.value }}"

    - name: Build gem
      run: gem build pubid.gemspec

    - name: Push gem to RubyGems
      if: ${{ !inputs.dry_run }}
      env:
        RUBYGEMS_API_KEY: ${{ secrets.METANORMA_CI_RUBYGEMS_API_KEY }}
      run: |
        mkdir -p ~/.gem
        cat > ~/.gem/credentials << EOF
        ---
        :rubygems_api_key: ${RUBYGEMS_API_KEY}
        EOF
        chmod 0600 ~/.gem/credentials
        if ! gem push "pubid-${{ steps.version.outputs.value }}.gem"; then
          echo "::error::gem push failed. A 401 'Invalid credentials' means the API key stored"
          echo "::error::in METANORMA_CI_RUBYGEMS_API_KEY was revoked or regenerated:"
          echo "::error::recreate it on rubygems.org (push_rubygem scope) and update the secret."
          exit 1
        fi

    - name: Push branch and tag
      if: ${{ !inputs.dry_run && inputs.next_version != 'skip' }}
      run: |
        git push origin "HEAD:${{ github.ref_name }}"
        git push origin "v${{ steps.version.outputs.value }}"

    - name: Create GitHub Release
      if: ${{ !inputs.dry_run && inputs.next_version != 'skip' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        FLAGS=()
        if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
          FLAGS+=(--prerelease)
        fi
        gh release create "v${{ steps.version.outputs.value }}" \
          --title "Release v${{ steps.version.outputs.value }}" \
          --generate-notes \
          "${FLAGS[@]}"

    - name: Dry-run summary
      if: ${{ inputs.dry_run }}
      run: |
        echo "## Dry-run summary"
        echo "Would have released pubid ${{ steps.version.outputs.value }} (prerelease=${{ steps.version.outputs.prerelease }})"
        ls -la ./*.gem || true
