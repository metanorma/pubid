# ISO conformance seed cases. Expectations were live-verified against the
# Ruby reference implementation on 2026-08-18 (hand-run, hand-recorded --
# the generator is TODO.restructure/10). Byte-exact: do not reformat.
- id: iso.amd.001
  input: "ISO 9001:2015/Amd 1:2020"
  expect:
    class_name: Pubid::Iso::Identifiers::Amendment
    to_s: "ISO 9001:2015/Amd 1:2020"
    to_hash:
      _type: pubid:iso:amendment
      number: "1"
      year: "2020"
      base:
        _type: pubid:iso:international-standard
        number: "9001"
        year: "2015"
    to_urn: "urn:iso:std:iso:9001:amd:2020:v1"
    roundtrip: true
- id: iso.is.001
  input: "ISO/IEC 17031-1:2020"
  expect:
    class_name: Pubid::Iso::Identifiers::InternationalStandard
    to_s: "ISO/IEC 17031-1:2020"
    to_hash:
      _type: pubid:iso:international-standard
      number: "17031"
      part: "1"
      year: "2020"
      copublishers:
        - IEC
    to_urn: "urn:iso:std:iso-iec:17031:-1"
    roundtrip: true
