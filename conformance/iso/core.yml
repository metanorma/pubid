- id: iso.amd.002
  input: "ISO/IEC 8802-3:2021/FDAM 1"
  expect:
    class_name: Pubid::Iso::Identifiers::Amendment
    to_s: "ISO/IEC 8802-3:2021/FDAM 1"
    to_hash:
      _type: pubid:iso:amendment
      number: "1"
      copublishers:
        - IEC
      stage: fdamd
      base:
        _type: pubid:iso:international-standard
        number: "8802"
        part: "3"
        year: "2021"
        copublishers:
          - IEC
    to_urn: "urn:iso:std:iso-iec:8802:-3:FDAM:amd:1:v1"
    roundtrip: true
    notes: "FDAM urn segment is current behavior; revisit under TODO.restructure/15."
