$schema: https://json-schema.org/draft/2020-12/schema
$id: https://pubid.com/conformance/case-2.0.0.yaml
title: PubID Conformance Corpus Case v2
description: >-
  One case in the language-independent test library. identifier is the
  semantic component tree (which part is which flavor-specific component,
  keyed to schema/{flavor}.yaml identifier_types); representations lists
  every proper output format the reference emits.
type: object
required: [id, input]
additionalProperties: false
properties:
  id:
    type: string
    pattern: '^[a-z0-9][a-z0-9._-]*$'
  input:
    type: string
    maxLength: 1000
  identifier:
    $ref: '#/$defs/component_tree'
  representations:
    type: object
    additionalProperties:
      type: string
  style:
    type: string
    enum: [v1, v2, v3]
    description: PubID styling version (v1 legacy ISO/R, v2 dotted uppercase, v3 modern); heuristic until model-truth (TODO 12).
  non_normalized_aliases:
    type: array
    items:
      type: object
      required: [input, style]
      additionalProperties: false
      properties:
        input:
          type: string
        style:
          type: string
          enum: [v1, v2, v3]
  roundtrip:
    type: boolean
  expect:
    type: object
    required: [error]
    additionalProperties: false
    properties:
      error:
        type: object
        required: [class_name]
        additionalProperties: false
        properties:
          class_name:
            type: string
  notes:
    type: string
$defs:
  component_tree:
    type: object
    required: [type, components]
    additionalProperties: false
    properties:
      type:
        type: string
        description: identifier_types[].key from schema/{flavor}.yaml
      components:
        type: object
        additionalProperties: true
      base:
        $ref: '#/$defs/component_tree'
